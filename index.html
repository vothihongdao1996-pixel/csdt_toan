<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0284C7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>🎮 Toán 1 - Phép Tính Cộng Trừ Phạm Vi 10</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #F0F9FF, #FEF9C3 35%, #FDF2F8 70%, #F0FDF4);
      overflow: hidden;
    }
    .loading-card {
      text-align: center;
      padding: 40px 50px;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(16px);
      border-radius: 32px;
      box-shadow: 0 8px 0 #bae6fd, 0 15px 25px rgba(0,0,0,0.08);
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .emoji-big { font-size: 4rem; display: block; margin-bottom: 16px; }
    h1 { font-size: clamp(1.4rem, 4vw, 2rem); color: #0284C7; margin-bottom: 8px; }
    p { font-size: clamp(0.9rem, 2.5vw, 1.1rem); color: #64748B; }
    .spinner {
      width: 48px; height: 48px;
      border: 5px solid #E0F2FE;
      border-top-color: #0284C7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loading-card">
    <span class="emoji-big">🧮</span>
    <h1>Chuẩn bị trò chơi…</h1>
    <p>Đang tải nội dung Toán lớp 1</p>
    <div class="spinner"></div>
  </div>
  <script>
    setTimeout(() => {
      window.location.href = './games/21_th_toan_1_cong_tru_10/game_01_Bat_dau.html';
    }, 1500);
  </script>
</body>
</html>
