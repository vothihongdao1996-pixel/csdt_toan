<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0284C7">
  <title>🧮 Toán 1: Cộng Trừ Phạm Vi 10</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Nunito',sans-serif;
      min-height:100vh;
      background:linear-gradient(160deg,#F0F9FF,#FEF9C3 35%,#FDF2F8 70%,#F0FDF4);
      overflow-x:hidden;
    }
    .wave-bg{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
    .wave-bg svg{position:absolute;bottom:-30px;width:200%;animation:waveMove 10s ease-in-out infinite}
    @keyframes waveMove{0%,100%{transform:translateX(0)}50%{transform:translateX(-25%)}}
    .container{max-width:700px;margin:0 auto;padding:20px;position:relative;z-index:1}
    .hero-card{
      background:rgba(255,255,255,0.85);backdrop-filter:blur(16px);
      border-radius:32px;padding:40px 32px;text-align:center;
      box-shadow:0 8px 0 #bae6fd,0 15px 25px rgba(0,0,0,0.08);
      margin-bottom:24px;
    }
    .hero-emoji{font-size:4.5rem;display:block;margin-bottom:16px;animation:bounce 2s ease-in-out infinite}
    @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
    h1{font-size:clamp(1.4rem,4.5vw,2.2rem);color:#0284C7;font-weight:900;margin-bottom:10px;line-height:1.3}
    .subtitle{font-size:clamp(0.9rem,2.5vw,1.15rem);color:#475569;font-weight:700;margin-bottom:28px;line-height:1.5}
    .start-btn{
      display:inline-flex;align-items:center;gap:10px;
      background:linear-gradient(135deg,#0284C7,#0369A1);color:#fff;
      font-family:'Nunito',sans-serif;font-size:clamp(1.1rem,3vw,1.4rem);font-weight:800;
      padding:16px 40px;border-radius:16px;border:none;cursor:pointer;
      border-bottom:5px solid #0369A1;
      box-shadow:0 8px 0 #bae6fd,0 15px 25px rgba(0,0,0,0.1);
      transition:all 0.15s ease;
    }
    .start-btn:hover{transform:translateY(-3px);box-shadow:0 11px 0 #7dd3fc,0 20px 35px rgba(0,0,0,0.15)}
    .start-btn:active{transform:translateY(3px);border-bottom-width:2px;box-shadow:0 2px 0 #7dd3fc,0 4px 10px rgba(0,0,0,0.1)}
    .info-badges{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:24px}
    .badge{
      background:#FEF3C7;color:#92400E;font-weight:800;font-size:0.85rem;
      padding:6px 14px;border-radius:999px;border:2px solid #FDE68A;
    }
    .student-picker{margin-top:20px}
    .student-picker label{font-weight:800;color:#334155;display:block;margin-bottom:8px;font-size:1rem}
    .student-select{
      width:100%;padding:14px 16px;border-radius:14px;border:3px solid #BAE6FD;
      font-family:'Nunito',sans-serif;font-size:1.05rem;font-weight:700;
      background:#fff;color:#0F172A;outline:none;appearance:none;cursor:pointer;
    }
    .student-select:focus{border-color:#0284C7}
    .nav-back{
      display:inline-flex;align-items:center;gap:6px;
      color:#0284C7;font-weight:800;font-size:0.95rem;text-decoration:none;
      padding:10px 0;margin-bottom:16px;
    }
    .nav-back:hover{color:#0369A1}
  </style>
</head>
<body>
  <div class="wave-bg">
    <svg viewBox="0 0 1440 320" xmlns="http://www.w3.org/2000/svg">
      <path fill="rgba(2,132,199,0.07)" d="M0,224L60,213.3C120,203,240,181,360,186.7C480,192,600,224,720,218.7C840,213,960,171,1080,165.3C1200,160,1320,192,1380,208L1440,224L1440,320L1380,320C1320,320,1200,320,1080,320C960,320,840,320,720,320C600,320,480,320,360,320C240,320,120,320,60,320L0,320Z"/>
    </svg>
  </div>

  <div class="container">
    <a href="../index.html" class="nav-back">← Quay lại thư viện</a>

    <div class="hero-card">
      <span class="hero-emoji">🧮</span>
      <h1>Toán 1: Phép Tính Cộng Trừ Trong Phạm Vi 10</h1>
      <p class="subtitle">Luyện tập phép tính và giải toán có lời văn.<br>Chọn đáp án đúng để nhận sao và leo đài vinh danh! 🏆</p>

      <div class="student-picker">
        <label for="studentSelect">👦 Bé chọn tên để bắt đầu:</label>
        <select id="studentSelect" class="student-select">
          <option value="">-- Chọn bạn học sinh --</option>
          <option value="be-anh">🧒 Anh</option>
          <option value="be-binh">👦 Bình</option>
          <option value="be-chau">👧 Châu</option>
          <option value="be-hoa">🌸 Hoa</option>
          <option value="be-lan">🌷 Lan</option>
          <option value="be-minh">⭐ Minh</option>
          <option value="be-ngoc">💎 Ngọc</option>
          <option value="be-tuan">🦁 Tuấn</option>
        </select>
      </div>

      <button class="start-btn" id="startBtn" onclick="startGame()">
        🚀 BẮT ĐẦU HỌC
      </button>

      <div class="info-badges">
        <span class="badge">📝 7 câu hỏi</span>
        <span class="badge">⏱️ Có đếm ngược</span>
        <span class="badge">🏆 Bảng xếp hạng</span>
        <span class="badge">🔊 Âm thanh TTS</span>
      </div>
    </div>
  </div>

  <script>
    function startGame() {
      const sel = document.getElementById('studentSelect');
      if (!sel.value) {
        sel.style.borderColor = '#EF4444';
        sel.style.animation = 'shakeError 0.4s ease';
        setTimeout(() => { sel.style.borderColor = '#BAE6FD'; sel.style.animation = ''; }, 600);
        return;
      }
      window.location.href = 'game_01_Bat_dau.html?student=' + encodeURIComponent(sel.value) + '&name=' + encodeURIComponent(sel.options[sel.selectedIndex].text.trim());
    }
  </script>
</body>
</html>
